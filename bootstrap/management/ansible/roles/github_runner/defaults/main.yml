---
github_runner_user: github-runner
github_runner_directory: /opt/actions-runner
github_runner_url: https://github.com/REPLACE_OWNER/REPLACE_REPOSITORY
github_runner_version: REPLACE_WITH_VERSION
github_runner_checksum: sha256:REPLACE_WITH_SHA256
github_runner_name: "{{ inventory_hostname }}"
github_runner_group: ""
github_runner_labels:
  - homelab-management
github_runner_registration_token: ""

github_runner_architecture_map:
  x86_64: x64
  aarch64: arm64
  armv7l: arm

