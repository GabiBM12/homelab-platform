---
- name: Validate the GitHub runner configuration
  ansible.builtin.assert:
    that:
      - github_runner_url is match('^https://github.com/[^/]+(/[^/]+)?$')
      - "'REPLACE_' not in github_runner_url"
      - github_runner_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
      - github_runner_checksum is match('^sha256:[a-fA-F0-9]{64}$')
      - ansible_facts.architecture in github_runner_architecture_map
    fail_msg: >-
      Set a valid GitHub repository/organization URL, runner version, and
      SHA-256 checksum in inventory/bootstrap/group_vars/all.yml. Use the
      values displayed by GitHub's New self-hosted runner page.

- name: Select the GitHub runner architecture
  ansible.builtin.set_fact:
    github_runner_architecture: >-
      {{ github_runner_architecture_map[ansible_facts.architecture] }}

- name: Create the unprivileged GitHub runner account
  ansible.builtin.user:
    name: "{{ github_runner_user }}"
    comment: GitHub Actions self-hosted runner
    create_home: true
    home: "/home/{{ github_runner_user }}"
    shell: /bin/bash
    system: true

- name: Add the runner to the root-equivalent Docker group when explicitly allowed
  ansible.builtin.user:
    name: "{{ github_runner_user }}"
    groups:
      - docker
    append: true
  when:
    - management_install_docker | default(false) | bool
    - management_allow_runner_docker | default(false) | bool

- name: Create the GitHub runner installation directory
  ansible.builtin.file:
    path: "{{ github_runner_directory }}"
    state: directory
    owner: "{{ github_runner_user }}"
    group: "{{ github_runner_user }}"
    mode: "0755"

- name: Check whether the runner is already registered
  ansible.builtin.stat:
    path: "{{ github_runner_directory }}/.runner"
  register: github_runner_registration

- name: Require a token for initial runner registration
  ansible.builtin.assert:
    that:
      - github_runner_registration_token | length > 20
    fail_msg: >-
      Supply the short-lived token from GitHub's New self-hosted runner page.
  when: not github_runner_registration.stat.exists
  no_log: true

- name: Download the verified GitHub runner archive
  ansible.builtin.get_url:
    url: >-
      https://github.com/actions/runner/releases/download/v{{ github_runner_version }}/actions-runner-linux-{{ github_runner_architecture }}-{{ github_runner_version }}.tar.gz
    dest: >-
      /var/tmp/actions-runner-linux-{{ github_runner_architecture }}-{{ github_runner_version }}.tar.gz
    checksum: "{{ github_runner_checksum }}"
    owner: root
    group: root
    mode: "0644"
  when: not github_runner_registration.stat.exists

- name: Extract the GitHub runner
  ansible.builtin.unarchive:
    src: >-
      /var/tmp/actions-runner-linux-{{ github_runner_architecture }}-{{ github_runner_version }}.tar.gz
    dest: "{{ github_runner_directory }}"
    remote_src: true
    owner: "{{ github_runner_user }}"
    group: "{{ github_runner_user }}"
    creates: "{{ github_runner_directory }}/config.sh"
  when: not github_runner_registration.stat.exists

- name: Install GitHub runner operating-system dependencies
  ansible.builtin.command:
    argv:
      - "{{ github_runner_directory }}/bin/installdependencies.sh"
  changed_when: false
  when: not github_runner_registration.stat.exists

- name: Register the GitHub runner
  ansible.builtin.command:
    argv: >-
      {{
        [
          github_runner_directory ~ '/config.sh',
          '--unattended',
          '--url', github_runner_url,
          '--token', github_runner_registration_token,
          '--name', github_runner_name,
          '--work', '_work',
          '--labels', github_runner_labels | join(',')
        ]
        + (
          ['--runnergroup', github_runner_group]
          if github_runner_group | length > 0
          else []
        )
      }}
    chdir: "{{ github_runner_directory }}"
  become_user: "{{ github_runner_user }}"
  when: not github_runner_registration.stat.exists
  register: github_runner_configured
  no_log: true

- name: Install the GitHub runner systemd service
  ansible.builtin.command:
    argv:
      - "{{ github_runner_directory }}/svc.sh"
      - install
      - "{{ github_runner_user }}"
    chdir: "{{ github_runner_directory }}"
  when: github_runner_configured is changed

- name: Start the GitHub runner service
  ansible.builtin.command:
    argv:
      - "{{ github_runner_directory }}/svc.sh"
      - start
    chdir: "{{ github_runner_directory }}"
  changed_when: false
