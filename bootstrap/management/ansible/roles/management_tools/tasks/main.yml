---
- name: Read the Debian package architecture
  ansible.builtin.command:
    argv:
      - dpkg
      - --print-architecture
  register: debian_architecture
  changed_when: false

- name: Install HashiCorp repository signing key
  ansible.builtin.get_url:
    url: https://apt.releases.hashicorp.com/gpg
    dest: /usr/share/keyrings/hashicorp-archive-keyring.asc
    owner: root
    group: root
    mode: "0644"

- name: Configure the HashiCorp apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ debian_architecture.stdout }} signed-by=/usr/share/keyrings/hashicorp-archive-keyring.asc]
      https://apt.releases.hashicorp.com {{ ansible_facts.distribution_release }} main
    filename: hashicorp
    state: present
    update_cache: true

- name: Install management and validation tools
  ansible.builtin.apt:
    name: "{{ management_tool_packages + ['terraform', 'packer'] }}"
    state: present

- name: Install Docker when explicitly enabled
  ansible.builtin.apt:
    name: docker.io
    state: present
  when: management_install_docker | bool

- name: Enable Docker when explicitly installed
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
  when: management_install_docker | bool
